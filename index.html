<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04070d">
<title>JARVIS</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
:root{--bg:#04070d;--fg:#d9e4ee;--muted:#5f7389;--accent:#00e5ff;--line:#12202e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0;background:
 radial-gradient(ellipse 70% 50% at 50% 42%,rgba(0,229,255,.10),transparent 60%),
 repeating-linear-gradient(0deg,transparent 0 39px,rgba(0,229,255,.035) 39px 40px),
 repeating-linear-gradient(90deg,transparent 0 39px,rgba(0,229,255,.035) 39px 40px);pointer-events:none}
header{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;font:400 12px "Share Tech Mono",monospace;letter-spacing:.18em;color:var(--accent);z-index:1}
header .st{color:var(--muted)}
.stage{position:relative;width:min(78vw,340px);aspect-ratio:1;display:grid;place-items:center;z-index:1}
canvas{position:absolute;inset:-25%;width:150%;height:150%}
.core{position:relative;width:62%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 50%,#eaffff 0 6%,#8df3ff 7% 18%,#0fb9d6 19% 36%,#063b55 37% 70%,#03111c 71% 100%);box-shadow:0 0 40px rgba(0,229,255,.55),0 0 120px rgba(0,229,255,.25),inset 0 0 40px rgba(0,229,255,.5);transition:transform .25s}
.core::after{content:"";position:absolute;inset:14%;border-radius:50%;border:2px solid rgba(0,229,255,.45);box-shadow:inset 0 0 24px rgba(0,229,255,.35)}
.speaking .core{animation:beat .55s ease-in-out infinite}
.listening .core{animation:breathe 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.name{font:400 clamp(28px,8vw,40px) "Share Tech Mono",monospace;letter-spacing:.32em;color:#fff;text-shadow:0 0 18px rgba(0,229,255,.8);z-index:1;margin:0}
.sub{font-size:13px;color:var(--muted);letter-spacing:.1em;z-index:1;text-align:center;margin:6px 0 0}
.deck{width:100%;max-width:520px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:0}
elevenlabs-convai{position:static!important}
@media (prefers-reduced-motion:reduce){.core{animation:none!important}}
</style>
</head>
<body>
<header><span>J.A.R.V.I.S.</span><span class="st" id="st">STANDBY</span></header>

<div class="stage" id="stage">
  <canvas id="ring"></canvas>
  <div class="core"></div>
</div>

<div>
  <h1 class="name">JARVIS</h1>
  <p class="sub">BOSS専属 AI秘書</p>
</div>

<div class="deck">
  <elevenlabs-convai agent-id="agent_9201m5k50323frsrfj4rq1ypmhts"></elevenlabs-convai>
  <p class="hint">下のボタンで通話開始。初回はマイクの許可を。</p>
</div>

<script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>
<script>
(function(){
  const c=document.getElementById('ring'),x=c.getContext('2d');
  const stage=document.getElementById('stage'),st=document.getElementById('st');
  let state='idle',t=0;
  function size(){const r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;}
  size();addEventListener('resize',size);
  function draw(){
    const w=c.width,h=c.height,cx=w/2,cy=h/2,R=Math.min(w,h)*0.3;
    x.clearRect(0,0,w,h);x.lineCap='round';
    const speed=state==='speaking'?2.2:state==='listening'?1.2:0.5;t+=0.01*speed;
    const rings=[[1.08,0.9,1],[1.22,0.6,-0.7],[1.38,0.35,0.45]];
    rings.forEach(([k,a,dir],i)=>{
      x.beginPath();x.strokeStyle=`rgba(0,229,255,${a*0.55})`;x.lineWidth=Math.max(1,w*0.004);
      x.arc(cx,cy,R*k,0,Math.PI*2);x.stroke();
      const segs=8+i*4;
      for(let s=0;s<segs;s++){const a0=t*dir+s*(Math.PI*2/segs),len=0.12+0.08*Math.sin(t*3+s);
        x.beginPath();x.strokeStyle=`rgba(0,229,255,${a})`;x.lineWidth=Math.max(2,w*0.012);
        x.arc(cx,cy,R*k,a0,a0+len);x.stroke();}
    });
    const ticks=60;for(let i=0;i<ticks;i++){const a=i*(Math.PI*2/ticks)+t*0.2,r1=R*1.5,r2=r1+(i%5?w*0.008:w*0.02);
      x.beginPath();x.strokeStyle='rgba(0,229,255,.35)';x.lineWidth=1;
      x.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);x.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);x.stroke();}
    requestAnimationFrame(draw);
  }
  draw();
  function setState(s){state=s;stage.className='stage '+s;st.textContent={idle:'STANDBY',connecting:'CONNECTING',listening:'LISTENING',speaking:'SPEAKING'}[s]||'STANDBY';}
  // Mirror the widget's status into the orb (best effort; widget internals may change)
  const mo=new MutationObserver(()=>{const el=document.querySelector('elevenlabs-convai');if(!el||!el.shadowRoot)return;
    const txt=(el.shadowRoot.textContent||'').toLowerCase();
    if(/speaking|jarvis/.test(txt)&&/speaking/.test(txt))setState('speaking');
    else if(/listening|聞いて/.test(txt))setState('listening');
    else if(/connecting|接続/.test(txt))setState('connecting');
    else setState('idle');});
  const boot=setInterval(()=>{const el=document.querySelector('elevenlabs-convai');if(el&&el.shadowRoot){mo.observe(el.shadowRoot,{subtree:true,childList:true,characterData:true});clearInterval(boot);}},500);
})();
</script>
</body>
</html>
