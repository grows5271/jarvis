<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04070d">
<title>JARVIS</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{--bg:#04070d;--fg:#d9e4ee;--muted:#5f7389;--accent:#00e5ff;--danger:#ff6a4f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(22px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0;background:
 radial-gradient(ellipse 70% 50% at 50% 40%,rgba(0,229,255,.10),transparent 60%),
 repeating-linear-gradient(0deg,transparent 0 39px,rgba(0,229,255,.035) 39px 40px),
 repeating-linear-gradient(90deg,transparent 0 39px,rgba(0,229,255,.035) 39px 40px);pointer-events:none}
header{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;font:400 12px "Share Tech Mono",monospace;letter-spacing:.18em;color:var(--accent);z-index:1}
header .st{color:var(--muted);transition:color .3s}
.live header .st,.speaking header .st,.listening header .st{color:var(--accent)}
.stage{position:relative;width:min(76vw,330px);aspect-ratio:1;display:grid;place-items:center;z-index:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
canvas{position:absolute;inset:-25%;width:150%;height:150%}
.core{position:relative;width:62%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 50%,#eaffff 0 6%,#8df3ff 7% 18%,#0fb9d6 19% 36%,#063b55 37% 70%,#03111c 71% 100%);box-shadow:0 0 40px rgba(0,229,255,.55),0 0 120px rgba(0,229,255,.25),inset 0 0 40px rgba(0,229,255,.5);transition:transform .25s,filter .3s}
.core::after{content:"";position:absolute;inset:14%;border-radius:50%;border:2px solid rgba(0,229,255,.45);box-shadow:inset 0 0 24px rgba(0,229,255,.35)}
.idle .core{filter:saturate(.6) brightness(.8)}
.speaking .core{animation:beat .5s ease-in-out infinite}
.listening .core{animation:breathe 1.6s ease-in-out infinite}
.connecting .core{animation:breathe .8s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.name{font:400 clamp(28px,8vw,40px) "Share Tech Mono",monospace;letter-spacing:.32em;color:#fff;text-shadow:0 0 18px rgba(0,229,255,.8);z-index:1;margin:0;text-align:center}
.sub{font-size:13px;color:var(--muted);letter-spacing:.1em;z-index:1;text-align:center;margin:6px 0 0;min-height:1.4em}
.deck{width:100%;max-width:420px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px}
.btn{width:100%;padding:18px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:#04121a;font:700 18px/1 "Zen Kaku Gothic New",system-ui,sans-serif;letter-spacing:.08em;cursor:pointer;box-shadow:0 0 24px rgba(0,229,255,.35);transition:background .2s,color .2s,box-shadow .2s}
.btn:active{transform:scale(.98)}
.btn.end{background:transparent;color:var(--danger);border-color:var(--danger);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:13px;color:var(--muted);text-align:center;margin:0;min-height:1.3em;max-width:36em}
.msg.err{color:var(--danger)}
@media (prefers-reduced-motion:reduce){.core{animation:none!important}}
</style>
</head>
<body class="idle">
<header><span>J.A.R.V.I.S.</span><span class="st" id="st">STANDBY</span></header>

<div class="stage" id="stage" role="button" aria-label="JARVISを呼ぶ">
  <canvas id="ring"></canvas>
  <div class="core"></div>
</div>

<div>
  <h1 class="name">JARVIS</h1>
  <p class="sub" id="sub">BOSS専属 AI秘書</p>
</div>

<div class="deck">
  <button class="btn" id="call" type="button">JARVISを呼ぶ</button>
  <p class="msg" id="msg"></p>
</div>

<script type="module">
const AGENT_ID='agent_9201m5k50323frsrfj4rq1ypmhts';
const $=id=>document.getElementById(id);
const stage=$('stage'),st=$('st'),sub=$('sub'),btn=$('call'),msg=$('msg');
let conv=null,state='idle',t=0;

/* ---- HUD rings ---- */
const c=$('ring'),x=c.getContext('2d');
function size(){const r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;}
size();addEventListener('resize',size);
function draw(){
  const w=c.width,h=c.height,cx=w/2,cy=h/2,R=Math.min(w,h)*0.3;
  x.clearRect(0,0,w,h);x.lineCap='round';
  const speed=state==='speaking'?2.4:state==='listening'?1.2:state==='connecting'?3:0.45;t+=0.01*speed;
  const dim=state==='idle'?0.6:1;
  [[1.08,0.9,1],[1.22,0.6,-0.7],[1.38,0.35,0.45]].forEach(([k,a,dir],i)=>{
    x.beginPath();x.strokeStyle=`rgba(0,229,255,${a*0.55*dim})`;x.lineWidth=Math.max(1,w*0.004);
    x.arc(cx,cy,R*k,0,Math.PI*2);x.stroke();
    const segs=8+i*4;
    for(let s=0;s<segs;s++){const a0=t*dir+s*(Math.PI*2/segs),len=0.12+0.08*Math.sin(t*3+s);
      x.beginPath();x.strokeStyle=`rgba(0,229,255,${a*dim})`;x.lineWidth=Math.max(2,w*0.012);
      x.arc(cx,cy,R*k,a0,a0+len);x.stroke();}
  });
  for(let i=0;i<60;i++){const a=i*(Math.PI*2/60)+t*0.2,r1=R*1.5,r2=r1+(i%5?w*0.008:w*0.02);
    x.beginPath();x.strokeStyle=`rgba(0,229,255,${.35*dim})`;x.lineWidth=1;
    x.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);x.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);x.stroke();}
  requestAnimationFrame(draw);
}
draw();

/* ---- state ---- */
const LABEL={idle:['STANDBY','BOSS専属 AI秘書'],connecting:['CONNECTING','接続中…'],listening:['LISTENING','聞いています'],speaking:['SPEAKING','JARVIS 発話中']};
function setState(s){state=s;document.body.className=s;st.textContent=LABEL[s][0];sub.textContent=LABEL[s][1];
  const live=s!=='idle';btn.textContent=live?'通話を終える':'JARVISを呼ぶ';btn.classList.toggle('end',live);}
function note(text,err){msg.textContent=text||'';msg.classList.toggle('err',!!err);}

/* ---- ElevenLabs ---- */
let Conversation=null;
async function loadSdk(){
  if(Conversation)return Conversation;
  const mod=await import('https://esm.sh/@elevenlabs/client');
  Conversation=mod.Conversation;return Conversation;
}
async function start(){
  btn.disabled=true;note('');setState('connecting');
  try{
    await loadSdk();
    try{await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){throw new Error('マイクが許可されていません。Safariの「ぁあ」→Webサイトの設定→マイクを「許可」にしてください。');}
    conv=await Conversation.startSession({
      agentId:AGENT_ID,
      onConnect:()=>setState('listening'),
      onDisconnect:()=>{conv=null;setState('idle');},
      onModeChange:({mode})=>setState(mode==='speaking'?'speaking':'listening'),
      onStatusChange:({status})=>{if(status==='disconnected'){conv=null;setState('idle');}},
      onError:(e)=>note('エラー: '+(e&&e.message||e),true),
    });
  }catch(e){conv=null;setState('idle');note(e&&e.message||String(e),true);}
  btn.disabled=false;
}
async function stop(){btn.disabled=true;try{await conv?.endSession();}catch(e){}conv=null;setState('idle');btn.disabled=false;}
function toggle(){conv?stop():start();}
btn.addEventListener('click',toggle);
stage.addEventListener('click',toggle);
</script>
</body>
</html>
